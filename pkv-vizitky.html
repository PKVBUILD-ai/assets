<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PKV Vizitky — Generátor</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--pkv-black);
      color: var(--pkv-white);
      font-family: "Open Sans", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────── */
    .vz-header {
      display: flex; align-items: center; gap: 16px;
      padding: 24px 40px;
      border-bottom: 1px solid #2a2a2a;
      flex: none;
    }
    .vz-header-title {
      font-size: 18px; font-weight: 700; color: #fff;
    }
    .vz-header-sub {
      font-size: 13px; color: var(--pkv-gray); margin-top: 2px;
    }

    /* ── Layout ──────────────────────────────────────────── */
    .vz-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* ── Form panel ──────────────────────────────────────── */
    .vz-form-panel {
      border-right: 1px solid #2a2a2a;
      padding: 36px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .vz-field-group {
      display: flex; flex-direction: column; gap: 4px;
    }
    .vz-field-group + .vz-field-group { margin-top: 4px; }

    .vz-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--pkv-gray);
      margin-bottom: 6px; display: block;
    }
    .vz-input {
      width: 100%;
      background: #222;
      border: 1.5px solid #383838;
      border-radius: 8px;
      padding: 11px 14px;
      color: #fff;
      font-family: "Open Sans", sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.18s ease;
    }
    .vz-input:focus { border-color: var(--pkv-green); }
    .vz-input::placeholder { color: #555; }

    .vz-divider {
      height: 1px; background: #2a2a2a; margin: 8px 0;
    }

    .vz-section-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #555;
      margin-bottom: 14px;
    }

    /* ── Export buttons ──────────────────────────────────── */
    .vz-actions {
      display: flex; flex-direction: column; gap: 10px;
      margin-top: auto; padding-top: 16px;
    }
    .vz-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 20px; border-radius: 8px; border: none;
      font-family: "Open Sans", sans-serif; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: all 0.15s ease;
      width: 100%;
    }
    .vz-btn-primary {
      background: var(--pkv-green); color: #1E1E1E;
    }
    .vz-btn-primary:hover { background: var(--pkv-mint); }
    .vz-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .vz-btn-secondary {
      background: transparent; color: var(--pkv-gray);
      border: 1.5px solid #383838;
    }
    .vz-btn-secondary:hover { border-color: var(--pkv-gray); color: #fff; }

    /* ── Preview panel ───────────────────────────────────── */
    .vz-preview-panel {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 40px; gap: 40px;
      position: relative;
      overflow: auto;
    }

    .vz-preview-row {
      display: flex; gap: 40px; align-items: flex-start;
      flex-wrap: wrap; justify-content: center;
    }

    .vz-preview-card-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .vz-preview-card-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #555;
    }

    /* ── The card itself ─────────────────────────────────── */
    /* 90×50mm at 96dpi = 340×189px; we use 1.8× scale for crisp display → 612×340px */
    .vz-card {
      width: 612px; height: 340px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      flex: none;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    /* Back side */
    .vz-card-back {
      background:
        radial-gradient(ellipse 70% 70% at 20% 20%, rgba(0,202,133,0.30) 0%, transparent 65%),
        radial-gradient(ellipse 60% 60% at 82% 78%, rgba(110,63,245,0.28) 0%, transparent 60%),
        #0d1110;
      display: flex; align-items: center; justify-content: center;
    }

    /* Front side */
    .vz-card-front {
      background:
        radial-gradient(ellipse 65% 65% at 18% 22%, rgba(110,63,245,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 70% 70% at 82% 80%, rgba(0,202,133,0.30) 0%, transparent 65%),
        #0d1110;
      display: flex; align-items: center;
      padding: 0 44px;
      gap: 36px;
    }

    /* QR container */
    .vz-card-qr-wrap {
      flex: none;
      width: 164px; height: 164px;
      background: #1a1a1a;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .vz-card-qr-wrap canvas,
    .vz-card-qr-wrap img { display: block; border-radius: 6px; }

    /* Card text */
    .vz-card-info {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center;
    }
    .vz-card-name {
      font-family: "Open Sans", sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .vz-card-position {
      font-family: "Open Sans", sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #c0c0c0;
      line-height: 1.3;
      margin-bottom: 18px;
    }
    .vz-card-contact {
      display: flex; flex-direction: column; gap: 4px;
    }
    .vz-card-contact-line {
      font-family: "Open Sans", sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: var(--pkv-green);
      line-height: 1.4;
    }

    /* PKV logo SVG on back */
    .vz-logo-mark {
      width: 120px;
      height: auto;
    }

    /* ── Export info ─────────────────────────────────────── */
    .vz-export-info {
      font-size: 12px; color: #555; text-align: center; line-height: 1.6;
    }
    .vz-export-info strong { color: var(--pkv-gray); }

    /* ── Loading overlay ─────────────────────────────────── */
    .vz-loading {
      position: fixed; inset: 0;
      background: rgba(14,14,14,0.85);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      z-index: 9999;
    }
    .vz-loading.active { display: flex; }
    .vz-loading-text {
      font-size: 15px; color: var(--pkv-gray); font-weight: 600;
    }
    .vz-spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: var(--pkv-green);
      border-radius: 50%;
      animation: vz-spin 0.8s linear infinite;
    }
    @keyframes vz-spin { to { transform: rotate(360deg); } }

    @media (max-width: 1100px) {
      .vz-layout { grid-template-columns: 1fr; }
      .vz-form-panel { border-right: none; border-bottom: 1px solid #2a2a2a; }
    }
    @media (max-width: 700px) {
      .vz-header { padding: 16px 20px; }
      .vz-card { width: 340px; height: 189px; border-radius: 8px; }
      .vz-card-front { padding: 0 24px; gap: 20px; }
      .vz-card-qr-wrap { width: 90px; height: 90px; border-radius: 12px; }
      .vz-card-name { font-size: 13px; margin-bottom: 2px; }
      .vz-card-position { font-size: 9px; margin-bottom: 10px; }
      .vz-card-contact-line { font-size: 8px; }
      .vz-logo-mark { width: 66px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="vz-header">
    <svg class="vz-logo-mark" style="width:56px;height:auto" viewBox="0 0 120 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 6 C8 6 4 14 8 22 L44 64 C48 72 58 72 62 64 L116 14 C120 6 112 -2 104 2 L62 26 C58 28 52 28 48 26 Z" fill="#00CA85"/>
      <text x="34" y="46" font-family="Open Sans,sans-serif" font-weight="700" font-size="22" fill="#1E1E1E" letter-spacing="-0.5">pkv</text>
    </svg>
    <div>
      <div class="vz-header-title">Generátor vizitiek</div>
      <div class="vz-header-sub">Vyplňte údaje → náhľad → export tlačových PDF</div>
    </div>
  </header>

  <!-- Main layout -->
  <div class="vz-layout">

    <!-- Form panel -->
    <aside class="vz-form-panel">
      <div>
        <div class="vz-section-label">Osobní údaje</div>

        <div class="vz-field-group">
          <label class="vz-label" for="f-titul">Titul</label>
          <input class="vz-input" id="f-titul" type="text" placeholder="Ing., Mgr., Dr. …" autocomplete="off">
        </div>

        <div class="vz-field-group" style="margin-top:14px">
          <label class="vz-label" for="f-meno">Jméno a příjmení</label>
          <input class="vz-input" id="f-meno" type="text" placeholder="Jan Novák" autocomplete="off">
        </div>

        <div class="vz-field-group" style="margin-top:14px">
          <label class="vz-label" for="f-pozicia">Pozice</label>
          <input class="vz-input" id="f-pozicia" type="text" placeholder="Obchodní ředitel" autocomplete="off">
        </div>
      </div>

      <div class="vz-divider"></div>

      <div>
        <div class="vz-section-label">Kontakt</div>

        <div class="vz-field-group">
          <label class="vz-label" for="f-email">E-mail</label>
          <input class="vz-input" id="f-email" type="email" placeholder="jan.novak@pkv.cz" autocomplete="off">
        </div>

        <div class="vz-field-group" style="margin-top:14px">
          <label class="vz-label" for="f-telefon">Telefon</label>
          <input class="vz-input" id="f-telefon" type="tel" placeholder="+420 601 123 456" autocomplete="off">
        </div>
      </div>

      <div class="vz-divider"></div>

      <div class="vz-actions">
        <button class="vz-btn vz-btn-primary" id="btn-export" onclick="exportPDF()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v8M5 7l3 3 3-3M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1"/></svg>
          Exportovat tiskové PDF
        </button>
        <div class="vz-export-info">
          Export: <strong>A4 PDF</strong> · 2 strany · bleed <strong>3 mm</strong> · ořezové značky<br>
          Formát vizitky: <strong>90 × 50 mm</strong>
        </div>
      </div>
    </aside>

    <!-- Preview panel -->
    <main class="vz-preview-panel">
      <div class="vz-preview-row">

        <div class="vz-preview-card-wrap">
          <div class="vz-preview-card-label">Přední strana</div>
          <div class="vz-card vz-card-front" id="card-front">
            <div class="vz-card-qr-wrap" id="qr-container"></div>
            <div class="vz-card-info">
              <div class="vz-card-name" id="preview-name">Jméno Příjmení</div>
              <div class="vz-card-position" id="preview-position">Funkce / dlouhý název</div>
              <div class="vz-card-contact">
                <div class="vz-card-contact-line" id="preview-email">mail@pkv.cz</div>
                <div class="vz-card-contact-line" id="preview-telefon">+420 123 123 123</div>
              </div>
            </div>
          </div>
        </div>

        <div class="vz-preview-card-wrap">
          <div class="vz-preview-card-label">Zadní strana (neměnná)</div>
          <div class="vz-card vz-card-back" id="card-back">
            <svg class="vz-logo-mark" viewBox="0 0 240 144" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M36 12 C16 12 8 28 16 44 L88 128 C96 144 116 144 124 128 L232 28 C240 12 224 -4 208 4 L124 52 C116 56 104 56 96 52 Z" fill="#00CA85"/>
              <text x="68" y="92" font-family="Open Sans,sans-serif" font-weight="700" font-size="44" fill="#1E1E1E" letter-spacing="-1">pkv</text>
            </svg>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Loading overlay -->
  <div class="vz-loading" id="loading">
    <div class="vz-spinner"></div>
    <div class="vz-loading-text">Generuji PDF…</div>
  </div>

  <script>
    /* ============================================================
       Live preview update
       ============================================================ */
    const fields = {
      titul:   document.getElementById('f-titul'),
      meno:    document.getElementById('f-meno'),
      pozicia: document.getElementById('f-pozicia'),
      email:   document.getElementById('f-email'),
      telefon: document.getElementById('f-telefon'),
    };

    const prevName     = document.getElementById('preview-name');
    const prevPosition = document.getElementById('preview-position');
    const prevEmail    = document.getElementById('preview-email');
    const prevTelefon  = document.getElementById('preview-telefon');

    function getDisplayName() {
      const titul = fields.titul.value.trim();
      const meno  = fields.meno.value.trim();
      if (!titul && !meno) return 'Jméno Příjmení';
      return [titul, meno].filter(Boolean).join(' ');
    }

    function updatePreview() {
      prevName.textContent     = getDisplayName();
      prevPosition.textContent = fields.pozicia.value.trim() || 'Funkce / dlouhý název';
      prevEmail.textContent    = fields.email.value.trim()   || 'mail@pkv.cz';
      prevTelefon.textContent  = fields.telefon.value.trim() || '+420 123 123 123';
      regenerateQR();
    }

    Object.values(fields).forEach(f => f.addEventListener('input', updatePreview));

    /* ============================================================
       QR code generation (vCard)
       ============================================================ */
    let qrInstance = null;

    function buildVCard() {
      const titul   = fields.titul.value.trim();
      const meno    = fields.meno.value.trim();
      const pozicia = fields.pozicia.value.trim();
      const email   = fields.email.value.trim();
      const tel     = fields.telefon.value.trim();

      // Split name into first/last heuristically
      const parts = meno.split(' ');
      const last  = parts.length > 1 ? parts[parts.length - 1] : parts[0] || '';
      const first = parts.length > 1 ? parts.slice(0, -1).join(' ') : '';

      return [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `N:${last};${first};;;${titul ? 'PREFIX=' + titul : ''}`,
        `FN:${[titul, meno].filter(Boolean).join(' ') || 'PKV Kontakt'}`,
        pozicia ? `TITLE:${pozicia}` : '',
        email   ? `EMAIL:${email}`   : '',
        tel     ? `TEL:${tel}`       : '',
        'ORG:PKV BUILD s.r.o.',
        'END:VCARD',
      ].filter(Boolean).join('\n');
    }

    function regenerateQR() {
      const container = document.getElementById('qr-container');
      container.innerHTML = '';

      const vcard = buildVCard();
      // QR size to fit inside the container: container is 164×164 in preview
      const qrSize = 140;

      try {
        new QRCode(container, {
          text: vcard,
          width:  qrSize,
          height: qrSize,
          colorDark:  '#ffffff',
          colorLight: '#1a1a1a',
          correctLevel: QRCode.CorrectLevel.M,
        });
      } catch (e) {
        console.warn('QR generation failed:', e);
      }
    }

    // Initial QR
    regenerateQR();

    /* ============================================================
       PDF export
       ============================================================ */
    async function exportPDF() {
      const btn = document.getElementById('btn-export');
      const loading = document.getElementById('loading');

      btn.disabled = true;
      loading.classList.add('active');

      try {
        const { jsPDF } = window.jspdf;

        // Card trim dimensions in mm
        const trimW = 90, trimH = 50;
        const bleed = 3;        // mm bleed each side
        const markGap = 2;      // mm gap between trim and mark start
        const markLen = 5;      // mm mark length
        const margin  = bleed + markGap + markLen; // total page margin each side

        const pageW = trimW + 2 * margin;
        const pageH = trimH + 2 * margin;

        const doc = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: [pageW, pageH],
        });

        const sides = [
          { el: document.getElementById('card-front'), label: 'Přední strana' },
          { el: document.getElementById('card-back'),  label: 'Zadní strana'  },
        ];

        for (let i = 0; i < sides.length; i++) {
          if (i > 0) doc.addPage([pageW, pageH], 'landscape');

          const { el } = sides[i];

          // Capture at 4× for 300 dpi equivalent
          // Card screen size: 612×340 px (2× of 306×170 logical)
          const canvas = await html2canvas(el, {
            scale: 4,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            logging: false,
          });

          const imgData = canvas.toDataURL('image/jpeg', 0.97);

          // Bleed box origin on page (mm)
          const bleedX = margin - bleed;
          const bleedY = margin - bleed;
          const bleedW = trimW + 2 * bleed;
          const bleedH = trimH + 2 * bleed;

          // Draw card image (covering bleed area)
          doc.addImage(imgData, 'JPEG', bleedX, bleedY, bleedW, bleedH);

          // Crop marks (trim corners)
          drawCropMarks(doc, margin, margin, trimW, trimH, markLen, markGap);

          // Page label (small, outside marks)
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(6);
          doc.setTextColor(150, 150, 150);
          doc.text(sides[i].label, margin, margin - markGap - markLen - 2, { align: 'left' });
        }

        // Name the file
        const name = fields.meno.value.trim().replace(/\s+/g, '_') || 'PKV_vizitka';
        doc.save(`${name}_vizitka_tisk.pdf`);

      } catch (err) {
        console.error('PDF export failed:', err);
        alert('Export se nezdařil: ' + err.message);
      } finally {
        btn.disabled = false;
        loading.classList.remove('active');
      }
    }

    function drawCropMarks(doc, trimX, trimY, trimW, trimH, markLen, gap) {
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.2);

      const x0 = trimX, x1 = trimX + trimW;
      const y0 = trimY, y1 = trimY + trimH;

      // Top-left
      doc.line(x0 - gap - markLen, y0, x0 - gap, y0);
      doc.line(x0, y0 - gap - markLen, x0, y0 - gap);
      // Top-right
      doc.line(x1 + gap, y0, x1 + gap + markLen, y0);
      doc.line(x1, y0 - gap - markLen, x1, y0 - gap);
      // Bottom-left
      doc.line(x0 - gap - markLen, y1, x0 - gap, y1);
      doc.line(x0, y1 + gap, x0, y1 + gap + markLen);
      // Bottom-right
      doc.line(x1 + gap, y1, x1 + gap + markLen, y1);
      doc.line(x1, y1 + gap, x1, y1 + gap + markLen);
    }
  </script>
</body>
</html>
